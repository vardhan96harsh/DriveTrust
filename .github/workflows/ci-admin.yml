name: Admin Portal CI

on:
  push:
    branches: [main, master]
    paths:
      - 'web/admin-portal/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'web/admin-portal/**'

jobs:
  build-admin:
    name: Next.js Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/admin-portal/package-lock.json'

      - name: Install Dependencies
        working-directory: web/admin-portal
        run: npm ci

      - name: Next.js Type Check & Build
        working-directory: web/admin-portal
        run: npm run build
