name: Mobile Apps Build & Release Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Driver App Debug
        working-directory: apps/driver-android
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace

      - name: Build Customer App Debug
        working-directory: apps/customer-android
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            apps/driver-android/app/build/outputs/apk/debug/*.apk
            apps/customer-android/app/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build & Validate iOS Customer App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build iOS Project (Simulator)
        working-directory: apps/customer-ios
        run: |
          xcodebuild -project DriveTrustCustomer.xcodeproj \
            -scheme DriveTrustCustomer \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS App Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-customer-app
          path: apps/customer-ios/build/Build/Products/Release-iphonesimulator/DriveTrustCustomer.app
