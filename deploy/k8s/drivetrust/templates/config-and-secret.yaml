apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "drivetrust.fullname" . }}-config
  labels:
    {{- include "drivetrust.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment | default "production" | quote }}
  POSTGRES_HOST: {{ .Values.postgresql.host | default "drivetrust-postgres" | quote }}
  POSTGRES_PORT: {{ .Values.postgresql.port | default "5432" | quote }}
  POSTGRES_DB: {{ .Values.postgresql.database | default "drivetrust_db" | quote }}
  REDIS_HOST: {{ .Values.redis.host | default "drivetrust-redis" | quote }}
  REDIS_PORT: {{ .Values.redis.port | default "6379" | quote }}
  KAFKA_BROKERS: {{ .Values.telematicsService.kafka.brokers | default "kafka:9092" | quote }}
  KAFKA_TOPIC: {{ .Values.telematicsService.kafka.topic | default "driver.telemetry.v1" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "drivetrust.fullname" . }}-secret
  labels:
    {{- include "drivetrust.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.user | default "drivetrust_admin" | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | default "ChangeMeInProdSecret!" | quote }}
  REDIS_PASSWORD: {{ .Values.redis.password | default "ChangeMeInProdRedisSecret!" | quote }}
  JWT_SIGNING_KEY: {{ .Values.global.jwtSigningKey | default "generate-or-mount-rsa-pem" | quote }}

