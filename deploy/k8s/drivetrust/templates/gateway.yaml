apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drivetrust.fullname" . }}-api-gateway
  labels:
    {{- include "drivetrust.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  replicas: {{ .Values.apiGateway.replicaCount | default 3 }}
  selector:
    matchLabels:
      {{- include "drivetrust.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        {{- include "drivetrust.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: "{{ .Values.apiGateway.image.repository }}:{{ .Values.apiGateway.image.tag }}"
          imagePullPolicy: {{ .Values.apiGateway.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "drivetrust.fullname" . }}-config
            - secretRef:
                name: {{ include "drivetrust.fullname" . }}-secret
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "drivetrust.fullname" . }}-api-gateway
  labels:
    {{- include "drivetrust.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  type: {{ .Values.apiGateway.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.apiGateway.service.port | default 80 }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    {{- include "drivetrust.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway

