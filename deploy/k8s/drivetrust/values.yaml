# Production values for DriveTrust Ultra Microservices
global:
  environment: production
  region: ap-south-1

apiGateway:
  replicaCount: 3
  image:
    repository: drivetrust/api-gateway
    tag: 1.0.0
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 80
    targetPort: 8080
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 256Mi

dispatchService:
  replicaCount: 4
  image:
    repository: drivetrust/dispatch-service
    tag: 1.0.0
  resources:
    limits:
      cpu: 2000m
      memory: 2048Mi
    requests:
      cpu: 500m
      memory: 512Mi

telematicsService:
  replicaCount: 6
  image:
    repository: drivetrust/telematics-service
    tag: 1.0.0
  kafka:
    brokers: "kafka:9092"
    topic: "driver.telemetry.v1"
    consumerGroup: "telematics-ingestion-workers"

redis:
  clusterMode: false
  host: "drivetrust-redis"
  port: 6379

postgresql:
  host: "drivetrust-postgres"
  port: 5432
  database: "drivetrust_db"
