version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: drivetrust-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drivetrust_db}
      POSTGRES_USER: ${POSTGRES_USER:-drivetrust_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretProdPassword123!}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-drivetrust_admin} -d ${POSTGRES_DB:-drivetrust_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - drivetrust-net

  redis:
    image: redis:7.2-alpine
    container_name: drivetrust-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-RedisAuthSecret123!}"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisAuthSecret123!}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - drivetrust-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: drivetrust-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafkadata:/tmp/kraft-combined-logs
    networks:
      - drivetrust-net

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: drivetrust-clickhouse
    restart: always
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhousedata:/var/lib/clickhouse
      - ./clickhouse/init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - drivetrust-net

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: drivetrust-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-MinioSecretPassword123!}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - drivetrust-net

  api-gateway:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: drivetrust-api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-drivetrust_db}
      POSTGRES_USER: ${POSTGRES_USER:-drivetrust_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretProdPassword123!}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisAuthSecret123!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://admin.drivetrust.in}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - drivetrust-net

  admin-portal:
    build:
      context: ../../web/admin-portal
      dockerfile: Dockerfile
    container_name: drivetrust-admin-portal
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    depends_on:
      - api-gateway
    networks:
      - drivetrust-net

networks:
  drivetrust-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  kafkadata:
  clickhousedata:
  miniodata:
